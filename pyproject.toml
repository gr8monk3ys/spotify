[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# media-core is a git dependency (see [project].dependencies) rather than a
# PyPI release; hatchling refuses direct references without this.
allow-direct-references = true

[project]
name = "spotifyforge"
version = "0.1.0"
description = "CLI and MCP server that turn Spotify liked songs into sequenced genre playlists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # The name-matching rules, the shared ~/.music path and the export
    # envelope, extracted from the three repos that were keeping copies of
    # them identical by hand. Pinned to a tag: a change to normalisation is a
    # change to which record matches which, and it should arrive deliberately.
    "media-core @ git+https://github.com/gr8monk3ys/media-core@v0.1.1",
    "tekore>=5.0,<7.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "keyring>=25.0",
    "pillow>=10.0",  # playlist cover art
    # 2.x renamed FastMCP to MCPServer; mcp_server.py is written against that.
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
spotifyforge = "spotifyforge.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests use PascalCase Mock* names (e.g. MockPM) that mirror the class they
# stand in for; renaming them to lowercase would hurt clarity.
# Inline test-data dicts are allowed to exceed the line limit for legibility.
# E741: lambda `l` in sorted() key is a common idiom in tests.
"tests/*.py" = ["N806", "E741", "E501"]
"tests/**/*.py" = ["N806", "E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "tekore.*"
ignore_missing_imports = true

# Test files and conftest: relax strict type checking for test utilities.
# Parametrized test methods receive dynamically-typed pytest fixtures and
# arguments; requiring full annotations would add noise without safety value.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "conftest"
ignore_errors = true

# Untyped third-party libraries. First-party modules are all checked — no
# ignore_errors: the blanket suppression previously hid every CLI/core
# interface-drift bug.
[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "spotifyforge.cli.*",
    "spotifyforge.core.playlist_manager",
    "spotifyforge.core.clients",
    "spotifyforge.core.discovery",
]
# Untyped tekore calls make full strictness impractical without stub
# packages. Crucially, check_untyped_defs stays on: function *bodies* are
# still fully checked (attr-defined / call-arg / return-value — the checks
# that catch interface drift); only the annotate-every-signature
# requirements are relaxed.
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
check_untyped_defs = true
disallow_any_generics = false
warn_return_any = false
disallow_subclassing_any = false
