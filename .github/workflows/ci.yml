permissions: read-all

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # media-core is a private repo (git dependency in pyproject.toml). CI reads it over SSH with a
      # read-only deploy key on gr8monk3ys/media-core, stored here as the MEDIA_CORE_DEPLOY_KEY secret
      # (also set for Dependabot).
      - name: Authenticate the private media-core dependency
        env:
          MEDIA_CORE_DEPLOY_KEY: ${{ secrets.MEDIA_CORE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MEDIA_CORE_DEPLOY_KEY" > ~/.ssh/media_core
          chmod 600 ~/.ssh/media_core
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/media_core -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gr8monk3ys/media-core".insteadOf "https://github.com/gr8monk3ys/media-core"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      # media-core is a private repo (git dependency in pyproject.toml). CI reads it over SSH with a
      # read-only deploy key on gr8monk3ys/media-core, stored here as the MEDIA_CORE_DEPLOY_KEY secret
      # (also set for Dependabot).
      - name: Authenticate the private media-core dependency
        env:
          MEDIA_CORE_DEPLOY_KEY: ${{ secrets.MEDIA_CORE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MEDIA_CORE_DEPLOY_KEY" > ~/.ssh/media_core
          chmod 600 ~/.ssh/media_core
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/media_core -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gr8monk3ys/media-core".insteadOf "https://github.com/gr8monk3ys/media-core"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      # media-core is a private repo (git dependency in pyproject.toml). CI reads it over SSH with a
      # read-only deploy key on gr8monk3ys/media-core, stored here as the MEDIA_CORE_DEPLOY_KEY secret
      # (also set for Dependabot).
      - name: Authenticate the private media-core dependency
        env:
          MEDIA_CORE_DEPLOY_KEY: ${{ secrets.MEDIA_CORE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MEDIA_CORE_DEPLOY_KEY" > ~/.ssh/media_core
          chmod 600 ~/.ssh/media_core
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/media_core -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gr8monk3ys/media-core".insteadOf "https://github.com/gr8monk3ys/media-core"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=spotifyforge --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report
          path: coverage.xml
